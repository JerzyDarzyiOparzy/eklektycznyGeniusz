# Rappers in the corpus. The selection criteria are public (shown on the site, in Polish).
criteria:
  - Co najmniej 2 płyty solowe (albo 1 płyta, jeśli raper jest kluczowy dla epoki) i co najmniej 8 000 słów we własnych zwrotkach.
  - Rozpiętość epok od lat 90. do dziś; żadna dekada nie przekracza 40% korpusu.
  - Różne style i regiony, nie tylko najpopularniejsi.
  - Liczymy tylko płyty studyjne (bez mixtape'ów, remiksów, składanek i wersji live), chyba że płyta jest oznaczona inaczej.

# genius_id is filled in by `rapdna resolve`.
# aliases: other names of the rapper in Genius section headers (e.g. „Bałagane”).
# albums: albums to fetch (names as on Genius, see `rapdna albums "<rapper>"`); empty = not fetched yet.
# excluded: fetched, but below the selection criteria (the value says why); the songs are left out of the analysis.
# exclude: song titles from these albums that are not counted (live versions, musicals, film transcripts).
artists:
  - name: Quebonafide
    aliases: ["Quebo", "Kuba Grabowski"]
    genius_id: 40889
    era: 2010s
    albums: ["Eklektyka", "Ezoteryka", "Egzotyka", "ROMANTIC PSYCHO", "PÓŁNOC / POŁUDNIE"]
    # transcript of the musical (dialogue, stage directions and stage versions of the album songs)
    exclude: ["QUEBONAFIDE AKT I - Północ Południe (Musical)"]
